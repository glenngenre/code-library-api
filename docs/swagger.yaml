basePath: /api
definitions:
  models.CreateSnippetRequest:
    properties:
      category:
        type: string
      code:
        minLength: 5
        type: string
      description:
        type: string
      filename:
        maxLength: 255
        minLength: 1
        type: string
      is_public:
        type: boolean
      language:
        maxLength: 50
        minLength: 1
        type: string
      title:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - code
    - filename
    - language
    - title
    type: object
  models.EmptyResponse:
    properties:
      success:
        type: boolean
    type: object
  models.GlobalLanguagesResponse:
    properties:
      data:
        items:
          type: string
        type: array
      success:
        type: boolean
    type: object
  models.GlobalSnippetsData:
    properties:
      total_snippets:
        type: integer
    type: object
  models.GlobalSnippetsResponse:
    properties:
      data:
        $ref: '#/definitions/models.GlobalSnippetsData'
      success:
        type: boolean
    type: object
  models.GlobalViewsData:
    properties:
      total_views:
        type: integer
    type: object
  models.GlobalViewsResponse:
    properties:
      data:
        $ref: '#/definitions/models.GlobalViewsData'
      success:
        type: boolean
    type: object
  models.Meta:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  models.Response:
    properties:
      data: {}
      success:
        type: boolean
    type: object
  models.Snippet:
    properties:
      category:
        type: string
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      filename:
        type: string
      id:
        type: integer
      is_featured:
        type: boolean
      is_public:
        type: boolean
      language:
        type: string
      snippet_id:
        type: string
      title:
        type: string
      updated_at:
        type: string
      views:
        type: integer
    type: object
  models.SnippetListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/models.Snippet'
        type: array
      meta:
        $ref: '#/definitions/models.Meta'
      success:
        type: boolean
    type: object
  models.SnippetResponse:
    properties:
      data:
        $ref: '#/definitions/models.Snippet'
      success:
        type: boolean
    type: object
host: codelibrary.skwtr.com
info:
  contact: {}
  description: API for code snippet sharing service
  title: Code Paste Service API
  version: "1.0"
paths:
  /snippet:
    post:
      consumes:
      - application/json
      description: Create a new code snippet with the provided details
      parameters:
      - description: Snippet payload
        in: body
        name: snippet
        required: true
        schema:
          $ref: '#/definitions/models.CreateSnippetRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.SnippetResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.EmptyResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.EmptyResponse'
      summary: Create a new snippet
      tags:
      - snippets
  /snippet/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve a single public code snippet by its unique ID
      parameters:
      - description: Snippet UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SnippetResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.EmptyResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.EmptyResponse'
      summary: Get a snippet by ID
      tags:
      - snippets
  /snippet/{id}/raw:
    get:
      consumes:
      - application/json
      description: Retrieve the raw code content of a public snippet by its unique
        ID. Returns plain text.
      parameters:
      - description: Snippet UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: Raw code content
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.EmptyResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.EmptyResponse'
      summary: Get raw snippet code by ID
      tags:
      - snippets
  /snippets:
    get:
      consumes:
      - application/json
      description: Retrieve a paginated list of all public code snippets
      parameters:
      - description: Search term to filter snippets by title, description, or language
        in: query
        name: search
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Number of items per page (default: 20, max: 100)'
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SnippetListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.EmptyResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.EmptyResponse'
      summary: Get all snippets
      tags:
      - snippets
    post:
      consumes:
      - application/json
      description: Create multiple code snippets in a single request. Accepts an array
        of snippet objects.
      parameters:
      - description: Array of snippet payloads
        in: body
        name: snippets
        required: true
        schema:
          items:
            $ref: '#/definitions/models.CreateSnippetRequest'
          type: array
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.EmptyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.Response'
      summary: Batch create snippets
      tags:
      - snippets
  /snippets/{id}/views:
    post:
      consumes:
      - application/json
      description: Increment the view count of a snippet by its ID. Deduplicates by
        hashing the client IP and snippet ID, so repeated calls from the same IP are
        ignored.
      parameters:
      - description: Snippet UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.EmptyResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.EmptyResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.EmptyResponse'
      summary: Increment snippet view count
      tags:
      - snippets
  /stats/languages:
    get:
      description: Retrieve a list of unique programming languages used in snippets
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.GlobalLanguagesResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.EmptyResponse'
      summary: Get unique programming languages
      tags:
      - stats
  /stats/snippets:
    get:
      description: Retrieve the total number of snippets created
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.GlobalSnippetsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.EmptyResponse'
      summary: Get total snippets count
      tags:
      - stats
  /stats/views:
    get:
      description: Retrieve the sum of views across all snippets
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.GlobalViewsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.EmptyResponse'
      summary: Get total view count
      tags:
      - stats
swagger: "2.0"
